<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Connect | Dashboard Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Boxicons for icons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0D0D0D;
            --card-color: #1A1A1A;
            --accent-color: #C4963D;
            --accent-hover: #E8B560;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0A0;
            --border-color: #2D2D2D;
            --danger-color: #FF1744;
            --glass-bg: rgba(26, 26, 26, 0.7);
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* BACKGROUND DECORATION */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background-color: var(--accent-color);
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            top: 20%;
            left: 20%;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background-color: #00B0FF;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.1;
            bottom: 20%;
            right: 20%;
            z-index: 0;
        }

        /* LOGIN CONTAINER */
        .login-container {
            width: 100%;
            max-width: 440px;
            z-index: 10;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .logo-section i {
            font-size: 40px;
            color: var(--accent-color);
            animation: pulse 2s infinite alternate;
        }

        .logo-section h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #FFFFFF 30%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-section p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: -4px;
        }

        /* FORM FIELD STYLES */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            font-size: 20px;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .form-input {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 14px 16px 14px 48px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--accent-color);
            background-color: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 10px rgba(196, 150, 61, 0.15);
        }

        .form-input:focus + i {
            color: var(--accent-color);
        }

        /* BUTTON STYLES */
        .login-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(196, 150, 61, 0.2);
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(196, 150, 61, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* ALERTS */
        .alert-error {
            background-color: rgba(255, 23, 68, 0.1);
            border: 1px solid rgba(255, 23, 68, 0.2);
            color: var(--danger-color);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-error i {
            font-size: 18px;
        }

        /* KEYFRAMES */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(196, 150, 61, 0.5)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 10px rgba(196, 150, 61, 0.8)); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <i class='bx bxs-gas-pump'></i>
                <h1>Fuel Connect</h1>
                <p>Administrative Console</p>
            </div>

            <!-- ERROR MESSAGE -->
            {% if error %}
            <div class="alert-error">
                <i class='bx bx-error-circle'></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- FORM -->
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <div class="input-wrapper">
                        <input class="form-input" type="text" id="phone" name="phone_number" placeholder="e.g. 0700000000" value="{{ phone_number|default:'' }}" required autocomplete="username">
                        <i class='bx bx-phone'></i>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 28px;">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        <i class='bx bx-lock-alt'></i>
                    </div>
                </div>

                <button class="login-btn" type="submit">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
